<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<!-- ⭐ NECESSARIO PER SMARTPHONE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confronto Memorie – X2</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0d0d0d;
        color:#f5f5f5;
        margin:0;
        padding:10px;
    }

    /* ⭐ NASCONDI COLONNE */
    .hide-col {
        display: none;
    }

    /* ⭐ STILE PULSANTI DI CONFRONTO */
    .btn-confronto {
        background:#444 !important;
        border:2px solid #777 !important;
        color:#ddd !important;
        width:100%;
        margin-top:10px;
        padding:12px 18px;
        font-size:18px;
        font-weight:bold;
        border-radius:6px;
        cursor:pointer;
        box-sizing:border-box;
    }

    .btn-confronto.attivo {
        background:#990000 !important;
        border-color:#ff3333 !important;
        color:white !important;
    }

    .page {
        max-width:900px;
        margin:0 auto;
        background:#1a1a1a;
        border:2px solid #444;
        padding:15px;
        border-radius:10px;
    }

    h1 {
        text-align:center;
        color:#ff3333;
        font-size:26px;
    }

    /* ⭐ TABELLA RESPONSIVE SU SMARTPHONE */
    .table-wrapper {
        overflow-x:auto;
        -webkit-overflow-scrolling: touch;
        margin-top:10px;
    }

    table {
        width:100%;
        border-collapse:collapse;
        min-width:600px;
    }

    th, td {
        border:1px solid #555;
        padding:6px;
        font-size:12px;
    }

    th {
        background:#333;
    }

    .param-row {
        background:#112211;
    }

    .diff {
        background:#331111;
    }

    .runtime {
        background:#222244;
    }

    /* ⭐ INPUT FILE PIÙ GRANDE */
    input[type="file"] {
        font-size:18px;
        width:100%;
    }

    label {
        font-size:22px;
        font-weight:bold;
        display:block;
        margin-bottom:6px;
    }

    .file-block {
        margin-bottom:25px;
    }

</style>

</head>
<body>

<div class="page">

    <h1>Confronto Memorie X2</h1>

    <h3>File HEX da confrontare</h3>

    <!-- FILE  A -->
    <div class="file-block">
        <label for="file1" id="labelFileA" style="color:#cc0000;">FILE A (SE NON SI SELEZIONA UN ALTRO FILE "DEFAULT POLLI")</label>
        <input type="file" id="file1" accept=".hex" onchange="salvaFile('A', this)">
    </div>

    <!-- FILE B -->
    <div class="file-block">
        <label for="file2" style="color:#0066cc;">FILE B</label>
        <input type="file" id="file2" accept=".hex" onchange="salvaFile('B', this)">

    </div>

    <!-- FILE C -->
    <div class="file-block">
        <label for="file3" style="color:#009933;">FILE C</label>
        <input type="file" id="file3" accept=".hex" onchange="salvaFile('C', this)">

    </div>

    <!-- ⭐ PULSANTI CONFRONTO -->
    <button id="btnAB" class="btn-confronto" onclick="confrontaAB()">Confronta A–B</button>
    <button id="btnAC" class="btn-confronto" onclick="confrontaAC()">Confronta A–C</button>
    <button id="btnBC" class="btn-confronto" onclick="confrontaBC()">Confronta B–C</button>
<button onclick="apriErrori()">Visualizza errori registrati (0x8000–0x8FFF)</button>


    <label style="margin-top:15px; display:block;">
    <input type="checkbox" id="flagVisualizzaTutto">
    Visualizza TUTTI i parametri (anche quelli uguali)
</label>

<!-- ============================================================
     FILTRI COLONNE (SMARTPHONE)
     ============================================================ -->
<div id="columnFilters" style="margin-top:20px; margin-bottom:10px;">

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="1" checked>
        Indirizzo
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="2" checked>
        Valore A
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="3" checked>
        Valore B
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="4" checked>
        Parametro
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="5" checked>
        Valore complessivo
    </label>

</div>

    <!-- ⭐ WRAPPER RESPONSIVE PER LE TABELLE -->
    <div class="table-wrapper">
        <div id="risultati" style="margin-top:30px;"></div>
    </div>

</div>

<!-- CARICA TABELLA PARAMETRI -->
<script src="../js/x2_parametri_data.js"></script>

<!-- CARICA IL FILE JS COMPLETO -->
<script src="confronto_memorie.js"></script>

<!-- ⭐ SCRIPT FILTRI COLONNE -->
<script>
document.addEventListener("change", function(e) {
    if (!e.target.classList.contains("col-flag")) return;

    const colIndex = parseInt(e.target.dataset.col);
    const hide = !e.target.checked;

    document.querySelectorAll("table").forEach(table => {
        table.querySelectorAll("tr").forEach(row => {
            const cell = row.children[colIndex - 1];
            if (cell) {
                cell.style.display = hide ? "none" : "";
            }
        });
    });
});
</script>
<script>
document.getElementById("flagVisualizzaTutto").addEventListener("change", () => {
    // Se non c’è un confronto attivo, non fare nulla
    if (!confrontoAttivo) return;

    // Rilancia il confronto attuale
    if (confrontoAttivo === "A-B") confrontaAB();
    if (confrontoAttivo === "A-C") confrontaAC();
    if (confrontoAttivo === "B-C") confrontaBC();
});
</script>

</body>
</html>
