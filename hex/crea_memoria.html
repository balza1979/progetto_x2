<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creazione Memoria – X2</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0d0d0d;
        color:#f5f5f5;
        margin:0;
        padding:10px;
    }

    .btn-git {
        background:#222;
        border:1px solid #555;
        color:#ddd;
        width:60%;
        margin-top:8px;
        padding:8px 12px;
        font-size:16px;
        border-radius:4px;
        cursor:pointer;
    }
    .btn-git:hover { background:#333; }

    .page {
        max-width:900px;
        margin:0 auto;
        background:#1a1a1a;
        border:2px solid #444;
        padding:15px;
        border-radius:10px;
    }

    h1 {
        text-align:center;
        color:#ff3333;
        font-size:26px;
    }

    input[type="file"] {
        font-size:18px;
        width:100%;
    }

    label {
        font-size:18px;
        font-weight:bold;
        display:block;
        margin-bottom:6px;
    }

    .file-block {
        margin-bottom:25px;
    }

    .popup {
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.75);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:9999;
    }

    .popup-content {
        background:#1a1a1a;
        border:2px solid #444;
        padding:20px;
        width:90%;
        max-width:500px;
        max-height:80%;
        overflow-y:auto;
        border-radius:10px;
    }

    .git-item {
        padding:10px;
        border-bottom:1px solid #333;
        cursor:pointer;
        font-size:18px;
    }
    .git-item:hover { background:#333; }

    .git-path {
        font-size:16px;
        margin-bottom:10px;
        color:#ffcc66;
    }
</style>

</head>
<body>

<button id="resetMem" onclick="resetCreazione()" style="display:none;"></button>

<div id="crea-memoria-container" style="display:none; padding:10px; border:1px solid #ccc; margin-bottom:10px;">
    <h2>Creazione nuova Memoria C</h2>

    <div>
        <strong>Memoria A:</strong>
        <span id="info-memoria-a">non caricata</span>
    </div>

    <div>
        <strong>Memoria B:</strong>
        <span id="info-memoria-b">non caricata</span>
    </div>

    <div style="margin-top:10px;">
        <label for="nome-memoria-c"><strong>Nome nuova Memoria C:</strong></label>
        <input type="text" id="nome-memoria-c" placeholder="es. PIPPO" />
    </div>

    <div style="margin-top:10px;">
        <button id="btn-conferma-nome-c">Conferma nome e salva</button>
    </div>
</div>

<div class="page">

    <h1>Creazione Memoria X2</h1>

    <h3>File di partenza</h3>

    <div class="file-block">
        <label for="file1" id="labelFileA" style="color:#cc0000;">FILE A</label>
        <input type="file" id="file1" accept=".hex,.bin" onchange="onFileA_Change()">
        <button class="btn-git" onclick="selezionaSlot('A')">Carica FILE A da Git</button>
    </div>

    <div class="file-block">
        <label for="file2" id="labelFileB" style="color:#0066cc;">FILE B</label>
        <input type="file" id="file2" accept=".hex,.bin" onchange="onFileB_Change()">
        <button class="btn-git" onclick="selezionaSlot('B')">Carica FILE B da Git</button>
    </div>

    <div id="selettoreGit" style="display:none; margin-top:20px;">
        <label>Seleziona file da Git:</label>

        <div id="gitList"
             style="max-height:300px; overflow-y:auto; padding:10px; background:#111; border:1px solid #444; border-radius:8px; margin-top:10px;">
        </div>

        <button id="btnChiudiGitList" class="btn-git"
                style="margin-top:10px; background:#444 !important; border:2px solid #777 !important; color:white !important;">
            Chiudi senza selezionare
        </button>

        <button id="btnConfermaGit" class="btn-git"
                style="display:none; margin-top:10px; background:#990000 !important; border:2px solid #ff3333 !important; color:white !important;">
            Conferma selezione
        </button>
    </div>

</div>

<script src="../js/x2_parametri_data.js"></script>
<script src="memorie_tipo.js"></script>
<script src="crea_memoria.js"></script>

</body>
</html>
