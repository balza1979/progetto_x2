<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Creazione Memoria – X2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#0d0d0d;
      color:#f5f5f5;
      margin:0;
      padding:20px;
    }
    .page {
      max-width:800px;
      margin:0 auto;
      background:#111133;
      border:3px solid #cc0000;
      padding:16px;
      box-sizing:border-box;
      border-radius:10px;
      box-shadow:0 0 25px rgba(255,0,0,0.45);
    }
    h1 {
      font-size:20px;
      color:#ff3333;
      text-align:center;
      margin-top:0;
      text-shadow:0 0 6px rgba(255,0,0,0.5);
    }
    .file-block {
      margin:12px 0;
      padding:10px;
      border-radius:8px;
      background:#1a1a1a;
      border:1px solid #444;
    }
    .file-block label {
      display:block;
      font-weight:bold;
      margin-bottom:6px;
      color:#ffcccc;
    }
    input[type="file"] {
      width:100%;
      box-sizing:border-box;
    }
    button {
      margin-top:6px;
      padding:6px 12px;
      border-radius:6px;
      border:2px solid #ff1a1a;
      background:#660000;
      color:#ffffff;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 0 10px rgba(255,0,0,0.4);
      font-size:12px;
    }
    button:disabled {
      opacity:0.4;
      cursor:not-allowed;
      box-shadow:none;
    }
    #crea-memoria-container {
      margin-top:18px;
      padding:12px;
      border-radius:8px;
      background:#221111;
      border:1px solid #aa3333;
      display:none;
    }
    #log {
      margin-top:10px;
      font-size:12px;
      color:#cccccc;
      white-space:pre-wrap;
    }

    /* Popup Git moderno */
    #selettoreGit {
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:90%;
      max-width:500px;
      max-height:70vh;
      background:#111;
      border:2px solid #ff3333;
      border-radius:10px;
      box-shadow:0 0 25px rgba(255,0,0,0.7);
      padding:10px;
      display:none;
      z-index:9999;
    }
    #selettoreGit h2 {
      margin:0 0 8px;
      font-size:16px;
      color:#ff6666;
    }
    #gitList {
      margin-top:8px;
      max-height:50vh;
      overflow-y:auto;
    }
    #gitButtons {
      margin-top:10px;
      text-align:right;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Creazione Memoria – X2</h1>

    <!-- FILE A -->
    <div class="file-block">
      <label id="labelFileA">FILE A (locale o Git)</label>
      <input type="file" id="file1" accept=".hex,.bin" onchange="onFileA_Change()">
      <button type="button" onclick="selezionaSlot('A')">Carica da Git (A)</button>
    </div>

    <!-- FILE B -->
    <div class="file-block">
      <label id="labelFileB">FILE B (locale o Git)</label>
      <input type="file" id="file2" accept=".hex,.bin" onchange="onFileB_Change()">
      <button type="button" onclick="selezionaSlot('B')">Carica da Git (B)</button>
    </div>

        <!-- RESET LOCALSTORAGE-->
    <button type="button" id="btnResetMemoria" style="margin-top:15px; background:#440000;">
  RESET MEMORIA (pulisci tutto)
</button>

    <!-- BLOCCO CREAZIONE MEMORIA C -->
    <div id="crea-memoria-container">
  <h2 style="margin-top:0; color:#ff9999;">Creazione Memoria C</h2>

  <p style="font-size:12px; color:#ffcccc;">
    Quando FILE A e FILE B sono caricati, puoi creare la nuova memoria C.
  </p>

  <!-- ===== INIZIO MODIFICA 05/06/2026 11:28 – Campo nome memoria C ===== -->
  <label for="nomeMemoriaC" style="font-size:12px; color:#ffcccc;">Nome nuova memoria C:</label>
  <input 
      type="text" 
      id="nomeMemoriaC" 
      placeholder="Inserisci nome memoria C"
      style="width:100%; padding:6px; margin-top:4px; margin-bottom:10px; border-radius:6px; border:1px solid #aa3333; background:#1a1a1a; color:#ffcccc;">
  <!-- ===== FINE MODIFICA 05/06/2026 11:28 ===== -->

  <!-- Pulsante reale per creare memoria C -->
  <button id="btnGeneraC" type="button">Crea Memoria C</button>

  <div id="log"></div>
</div>


  <!-- PARAMETRI X2 -->
  <script src="../js/x2_parametri_data.js"></script>

  <!-- POPUP GIT -->
  <div id="selettoreGit">
    <h2>Seleziona memoria da Git</h2>
    <div id="gitList"></div>
    <div id="gitButtons">
      <button id="btnChiudiGitList" type="button">Chiudi</button>
    </div>
  </div>

  <!-- TENDINA GIT MODERNA -->
  <script src="memorie_tipo.js"></script>

  <!-- LOGICA CREA MEMORIA -->
  <script src="crea_memoria_v2.js"></script>
</body>
</html>
