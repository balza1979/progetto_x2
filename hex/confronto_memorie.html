<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confronto Memorie – X2</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0d0d0d;
        color:#f5f5f5;
        margin:0;
        padding:10px;
    }
.btn-git {
    background:#222;
    border:1px solid #555;
    color:#ddd;
    width:60%;
    margin-top:8px;
    padding:8px 12px;
    font-size:16px;
    border-radius:4px;
    cursor:pointer;
}
.btn-git:hover {
    background:#333;
}

    .btn-confronto {
        background:#444;
        border:2px solid #777;
        color:#ddd;
        width:100%;
        margin-top:10px;
        padding:12px 18px;
        font-size:18px;
        font-weight:bold;
        border-radius:6px;
        cursor:pointer;
        box-sizing:border-box;
    }

    .btn-confronto.attivo {
        background:#990000;
        border-color:#ff3333;
        color:white;
    }

    .page {
        max-width:900px;
        margin:0 auto;
        background:#1a1a1a;
        border:2px solid #444;
        padding:15px;
        border-radius:10px;
    }

    h1 {
        text-align:center;
        color:#ff3333;
        font-size:26px;
    }

    .table-wrapper {
        overflow-x:auto;
        -webkit-overflow-scrolling: touch;
        margin-top:10px;
    }

    table {
        width:100%;
        border-collapse:collapse;
        min-width:700px;
    }

    th, td {
        border:1px solid #555;
        padding:6px;
        font-size:12px;
    }

    th {
        background:#333;
    }

    .param-row {
        background:#112211;
    }

    .diff {
        background:#331111;
    }

    .runtime {
        background:#222244;
    }

    input[type="file"] {
        font-size:18px;
        width:100%;
    }

    label {
        font-size:18px;
        font-weight:bold;
        display:block;
        margin-bottom:6px;
    }

    .file-block {
        margin-bottom:25px;
    }

    /* POPUP GIT */
    .popup {
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.75);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:9999;
    }

    .popup-content {
        background:#1a1a1a;
        border:2px solid #444;
        padding:20px;
        width:90%;
        max-width:500px;
        max-height:80%;
        overflow-y:auto;
        border-radius:10px;
    }

    .git-item {
        padding:10px;
        border-bottom:1px solid #333;
        cursor:pointer;
        font-size:18px;
    }

    .git-item:hover {
        background:#333;
    }

    .git-path {
        font-size:16px;
        margin-bottom:10px;
        color:#ffcc66;
    }
</style>

</head>
<body>

<div class="page">

    <h1>Confronto Memorie X2</h1>

    <h3>File HEX da confrontare</h3>

    <!-- FILE A -->
    <div class="file-block">
        <label for="file1" id="labelFileA" style="color:#cc0000;">FILE A</label>
        <input type="file" id="file1" accept=".hex,.bin">

        <!-- Pulsante Git sotto FILE A -->
        <button class="btn-git" onclick="selezionaSlot('A')">Carica FILE A da Git</button>
    </div>

    <!-- FILE B -->
    <div class="file-block">
        <label for="file2" id="labelFileB" style="color:#0066cc;">FILE B</label>
        <input type="file" id="file2" accept=".hex,.bin">

        <!-- Pulsante Git sotto FILE B -->
        <button class="btn-git" onclick="selezionaSlot('B')">Carica FILE B da Git</button>
    </div>

    <!-- FILE C -->
    <div class="file-block">
        <label for="file3" id="labelFileC" style="color:#009933;">FILE C</label>
        <input type="file" id="file3" accept=".hex,.bin">

        <!-- Pulsante Git sotto FILE C -->
       <button class="btn-git" onclick="selezionaSlot('C')">Carica FILE C da Git</button>
    </div>

    <!-- ⭐⭐ TENDINA + CONFERMA (NASCOSTI) ⭐⭐ -->
    <div id="selettoreGit" style="display:none; margin-top:20px;">
        <label>Seleziona file da Git:</label>
        <select id="gitSelect" style="width:100%; padding:10px; font-size:18px;"></select>

        <button id="btnConfermaGit" class="btn-git" style="display:none; margin-top:10px;">
            Conferma selezione
        </button>
    </div>

    <!-- PULSANTI -->
  <button id="btnAB" class="btn-confronto" onclick="confrontaAB()" style="margin-top:25px;">
    Confronta A–B
</button>

    <button id="btnAC" class="btn-confronto" onclick="confrontaAC()">Confronta A–C</button>
    <button id="btnBC" class="btn-confronto" onclick="confrontaBC()">Confronta B–C</button>
    <button id="btnABC" class="btn-confronto" onclick="confrontaABC()">Confronta A–B–C</button>

    <button onclick="apriErrori()">Visualizza errori registrati (0x8000–0x8FFF)</button>

    <label style="margin-top:15px; display:block;">
        <input type="checkbox" id="flagVisualizzaTutto">
        Visualizza TUTTI i parametri (anche quelli uguali)
    </label>

    <!-- FILTRI COLONNE -->
    <div id="columnFilters" style="margin-top:20px; margin-bottom:10px;">
        <label><input type="checkbox" class="col-flag" data-col="col-indirizzo" checked> Indirizzo</label>
        <label><input type="checkbox" class="col-flag" data-col="col-valA" checked> Valore A</label>
        <label><input type="checkbox" class="col-flag" data-col="col-valB" checked> Valore B</label>
        <label><input type="checkbox" class="col-flag" data-col="col-valC" checked> Valore C</label>
        <label><input type="checkbox" class="col-flag" data-col="col-parametro" checked> Parametro</label>
        <label><input type="checkbox" class="col-flag" data-col="col-valore" checked> Valore complessivo</label>
    </div>

    <div class="table-wrapper">
        <div id="risultati" style="margin-top:30px;"></div>
    </div>

</div>

<!-- POPUP GIT -->
<div id="gitPopup" class="popup" style="display:none;">
    <div class="popup-content">
        <h3>Seleziona file da Git</h3>
        <div id="gitList"></div>
        <button onclick="chiudiPopup()">Chiudi</button>
    </div>
</div>

<!-- DATI PARAMETRI -->
<script src="../js/x2_parametri_data.js"></script>



<!-- GESTIONE MEMORIE (deve stare in /hex/) -->
<script src="memorie_tipo.js"></script>

<!-- LOGICA CONFRONTO (già in /hex/) -->
<script src="confronto_memorie.js"></script>


<!-- FILTRI COLONNE -->
<script>
document.addEventListener("change", function(e) {
    if (!e.target.classList.contains("col-flag")) return;

    const colClass = e.target.dataset.col;
    const hide = !e.target.checked;

    document.querySelectorAll("." + colClass).forEach(cell => {
        cell.style.display = hide ? "none" : "";
    });
});
</script>

<!-- RILANCIO CONFRONTO QUANDO CAMBIA LA SPUNTA -->
<script>
document.getElementById("flagVisualizzaTutto").addEventListener("change", () => {

    if (confrontoAttivo === "A-B")   confrontaAB();
    if (confrontoAttivo === "A-C")   confrontaAC();
    if (confrontoAttivo === "B-C")   confrontaBC();
    if (confrontoAttivo === "A-B-C") confrontaABC();

});
</script>

</body>
</html>
