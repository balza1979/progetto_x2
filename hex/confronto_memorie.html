<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<!-- ⭐ NECESSARIO PER SMARTPHONE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confronto Memorie – X2</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background:#0d0d0d;
        color:#f5f5f5;
        margin:0;
        padding:10px;
    }
.hide-col {
    display: none;
}

    .page {
        max-width:900px;
        margin:0 auto;
        background:#1a1a1a;
        border:2px solid #444;
        padding:15px;
        border-radius:10px;
    }

    h1 {
        text-align:center;
        color:#ff3333;
        font-size:26px;
    }

    /* ⭐ TABELLA RESPONSIVE SU SMARTPHONE */
    .table-wrapper {
        overflow-x:auto;
        -webkit-overflow-scrolling: touch;
        margin-top:10px;
    }

    table {
        width:100%;
        border-collapse:collapse;
        min-width:600px; /* evita che si schiacci troppo */
    }

    th, td {
        border:1px solid #555;
        padding:6px;
        font-size:12px;
    }

    th {
        background:#333;
    }

    .param-row {
        background:#112211;
    }

    .diff {
        background:#331111;
    }

    .runtime {
        background:#222244;
    }

    /* ⭐ PULSANTI PIÙ GRANDI SU SMARTPHONE */
    button {
        padding:12px 18px;
        margin-top:10px;
        cursor:pointer;
        background:#660000;
        color:white;
        border:2px solid #ff3333;
        border-radius:6px;
        font-weight:bold;
        font-size:18px;
        width:100%; /* su smartphone diventano a tutta larghezza */
        box-sizing:border-box;
    }

    /* ⭐ INPUT FILE PIÙ GRANDE */
    input[type="file"] {
        font-size:18px;
        width:100%;
    }

    label {
        font-size:22px;
        font-weight:bold;
        display:block;
        margin-bottom:6px;
    }

    /* ⭐ SPAZIATURA MIGLIORE SU SMARTPHONE */
    .file-block {
        margin-bottom:25px;
    }

</style>

</head>
<body>

<div class="page">

    <h1>Confronto Memorie X2</h1>

    <h3>File HEX da confrontare</h3>

    <!-- FILE A -->
    <div class="file-block">
        <label for="file1" style="color:#cc0000;">FILE A</label>
        <input type="file" id="file1" accept=".hex">
    </div>

    <!-- FILE B -->
    <div class="file-block">
        <label for="file2" style="color:#0066cc;">FILE B</label>
        <input type="file" id="file2" accept=".hex">
    </div>

    <!-- FILE C -->
    <div class="file-block">
        <label for="file3" style="color:#009933;">FILE C</label>
        <input type="file" id="file3" accept=".hex">
    </div>

    <!-- PULSANTI -->
    <button onclick="confrontaAB()">Confronta A–B</button>
    <button onclick="confrontaAC()">Confronta A–C</button>
    <button onclick="confrontaBC()">Confronta B–C</button>

    <button onclick="avviaConfronto()">Avvia confronto</button>
<!-- ============================================================
     FILTRI COLONNE (SMARTPHONE)
     ============================================================ -->
<div id="columnFilters" style="margin-top:20px; margin-bottom:10px;">

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="1" checked>
        Indirizzo
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="2" checked>
        Valore A
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="3" checked>
        Valore B
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="4" checked>
        Parametro
    </label>

    <label style="margin-right:10px;">
        <input type="checkbox" class="col-flag" data-col="5" checked>
        Valore complessivo
    </label>

</div>

    <!-- ⭐ WRAPPER RESPONSIVE PER LE TABELLE -->
    <div class="table-wrapper">
        <div id="risultati" style="margin-top:30px;"></div>
    </div>

</div>

<!-- CARICA TABELLA PARAMETRI -->
<script src="../js/x2_parametri_data.js"></script>

<!-- CARICA IL FILE JS COMPLETO -->
<script src="confronto_memorie.js"></script>
<script>
document.addEventListener("change", function(e) {
    if (!e.target.classList.contains("col-flag")) return;

    const colIndex = parseInt(e.target.dataset.col);
    const hide = !e.target.checked;

    // Seleziona tutte le tabelle generate
    document.querySelectorAll("table").forEach(table => {
        // Seleziona tutte le righe
        table.querySelectorAll("tr").forEach(row => {
            const cell = row.children[colIndex - 1];
            if (cell) {
                cell.style.display = hide ? "none" : "";
            }
        });
    });
});
</script>

</body>
</html>
