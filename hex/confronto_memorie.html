<!DOCTYPE html>
<html lang="it">
<head>

<style>

        max-width:900px;

        padding:20px;

    }
    h1 {
        text-align:center;
        color:#ff3333;
    }
    table {
        width:100%;
        border-collapse:collapse;
        margin-top:10px;

        border:1px solid #555;

    .param-row {
        background:#112211;
    }
    .diff {

    .runtime {

    }
    button {

<body>
