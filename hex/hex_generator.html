<body>
  <div class="page">

    <div class="section-title">Sorgente dati (CSV)</div>

    <textarea id="csv_input" placeholder="Qui in futuro potrai incollare o caricare il CSV con indirizzi..."></textarea>

  <script>
 <script>
// =========================================================
//  SCRIPT: GENERATORE HEX X1
//  DATA: 15/04/2026 - ORA: 19:30
//  VERSIONE: v0.2 - Buffer 8192 byte a 0x00 + blocchi a 0xFF
// =========================================================

const logDiv = document.getElementById("log");
const btnGenera = document.getElementById("genera_hex_btn");

function log(msg) {
  logDiv.textContent += msg + "\n";
}

// Crea buffer 8192 byte inizializzato a 0x00
function creaBufferMemoria() {
  const size = 8192;
  const buf = new Uint8Array(size);
  buf.fill(0x00);   // <-- TUTTO A 00
  return buf;
}

// Imposta a 0xFF i blocchi indicati
// ranges = [ { start: 0, end: 15 }, { start: 128, end: 255 }, ... ]
function applicaBlocchiFF(buf, ranges) {
  ranges.forEach(r => {
    const s = Math.max(0, r.start);
    const e = Math.min(buf.length - 1, r.end);
    for (let i = s; i <= e; i++) {
      buf[i] = 0xFF;
    }
  });
}

// Checksum Intel HEX
function intelHexChecksum(byteArray) {
  let sum = 0;
  for (let i = 0; i < byteArray.length; i++) {
    sum = (sum + byteArray[i]) & 0xFF;
  }
  const chk = ((~sum + 1) & 0xFF);
  return chk;
}

// Converte buffer in stringa Intel HEX (record da 16 byte)
function bufferToIntelHex(buf, baseAddress = 0x0000) {
  const lines = [];
  const recordSize = 16;

  for (let addr = 0; addr < buf.length; addr += recordSize) {
    const chunk = buf.slice(addr, addr + recordSize);
    const byteCount = chunk.length;
    const address = baseAddress + addr;
    const recordType = 0x00;

    const bytes = [byteCount, (address >> 8) & 0xFF, address & 0xFF, recordType];
    for (let i = 0; i < chunk.length; i++) {
      bytes.push(chunk[i]);
    }

    const chk = intelHexChecksum(bytes);
    let line = ":" + bytes.map(b => b.toString(16).toUpperCase().padStart(2, "0")).join("") +
               chk.toString(16).toUpperCase().padStart(2, "0");
    lines.push(line);
  }

  // Record di fine file
  lines.push(":00000001FF");
  return lines.join("\n");
}

function scaricaFile(nome, contenuto) {
  const blob = new Blob([contenuto], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

btnGenera.addEventListener("click", function () {
  log("Creazione buffer memoria 8192 byte a 0x00...");
  const buf = creaBufferMemoria();

  // 👉 QUI METTEREMO I BLOCCHI A 0xFF
  const blocchiFF = [
    // Esempio finto:
    // { start: 0, end: 15 },
    // { start: 128, end: 255 },
  ];
  applicaBlocchiFF(buf, blocchiFF);

  log("Conversione in formato Intel HEX...");
  const hex = bufferToIntelHex(buf, 0x0000);

  log("Download file: x1_memoria.hex");
  scaricaFile("x1_memoria.hex", hex);
  log("Operazione completata.\n");
});
</script>
