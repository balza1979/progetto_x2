<!--  - Crea buffer 8192 byte                                  -->
<!--  - Esporta file Intel HEX                                 -->
<!--  - Legge parametri da x2_parametri_data.js                -->
<!-- ========================================================= -->
<head>
  <meta charset="UTF-8">
  <title>Generatore Memoria HEX – X1/X2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#0d0d0d;
      color:#f5f5f5;

    }
  </style>

<body>
  <div class="page">
    <h1>Generatore Memoria HEX – X1/X2</h1>

    <div class="section-title">Sorgente dati (CSV)</div>
    <label>Per ora mock: in seguito leggeremo il CSV reale con indirizzi.</label>
    <textarea id="csv_input" placeholder="Qui in futuro potrai incollare o caricare il CSV con indirizzi..."></textarea>

    <button id="genera_hex_btn">Genera file HEX (8192 byte + parametri)</button>

    <div class="section-title">Log operazioni</div>
    <div id="log" class="log"></div>
  </div>

  <!-- ⚠️ IMPORTANTE: carica prima la tabella parametri -->
  <!-- <script src="../js/x2_parametri_data.js"></script> -->
<script src="../js/x2_parametri_data.js"></script>

  <script>
  // =========================================================
  //  SCRIPT: GENERATORE HEX X1/X2
  //  DATA: 15/04/2026 - ORA: 19:30
  //  VERSIONE: v0.3 - Buffer 8192 byte + blocchi FF + parser parametri
  // =========================================================

  const logDiv = document.getElementById("log");
  const btnGenera = document.getElementById("genera_hex_btn");

  function log(msg) {
    logDiv.textContent += msg + "\n";
  }

  // Crea buffer 8192 byte inizializzato a 0x00
  function creaBufferMemoria() {
    const size = 8192;
    const buf = new Uint8Array(size);
    buf.fill(0x00);
    return buf;
  }

  // Imposta a 0xFF i blocchi indicati
  function applicaBlocchiFF(buf, ranges) {
    ranges.forEach(r => {
      const s = Math.max(0, r.start);
      const e = Math.min(buf.length - 1, r.end);
      for (let i = s; i <= e; i++) {
        buf[i] = 0xFF;
      }
    });
  }

  // Checksum Intel HEX
  function intelHexChecksum(byteArray) {
    let sum = 0;
    for (let i = 0; i < byteArray.length; i++) {
      sum = (sum + byteArray[i]) & 0xFF;
    }
    const chk = ((~sum + 1) & 0xFF);
    return chk;
  }

  // Converte buffer in stringa Intel HEX (record da 16 byte)
  function bufferToIntelHex(buf, baseAddress = 0x0000) {
    const lines = [];

    // Riga extended linear address per essere identico al programmatore
    lines.push("aaaa:020000040000FA");

    const recordSize = 16;

    for (let addr = 0; addr < buf.length; addr += recordSize) {
      const chunk = buf.slice(addr, addr + recordSize);
      const byteCount = chunk.length;
      const address = baseAddress + addr;
      const recordType = 0x00;

      const bytes = [byteCount, (address >> 8) & 0xFF, address & 0xFF, recordType];
      for (let i = 0; i < chunk.length; i++) {
        bytes.push(chunk[i]);
      }

      const chk = intelHexChecksum(bytes);
      let line = ":" + bytes.map(b => b.toString(16).toUpperCase().padStart(2, "0")).join("") +
                 chk.toString(16).toUpperCase().padStart(2, "0");
      lines.push(line);
    }

    // Record di fine file
    lines.push(":00000001FF");
    return lines.join("\n");
  }

  function scaricaFile(nome, contenuto) {
    const blob = new Blob([contenuto], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ⭐ PARSER INTELLIGENTE: legge x2_parametri e scrive nel buffer
  function scriviParametriDaTabella(buf) {
    if (typeof x2_parametri === "undefined") {
      log("ATTENZIONE: x2_parametri non definito. Hai caricato x2_parametri_data.js?");
      return;
    }

    let count = 0;

    x2_parametri.forEach(p => {
      const addr = parseInt(p.LIBERA1);
      if (isNaN(addr)) return;

      const size = parseInt(p.LIBERA2);
      if (isNaN(size) || size <= 0) return;

      const tipo = (p.LIBERA3 || "").toUpperCase();
      let valStr = (p.VALORE || "").trim();
      if (valStr === "") return;

      // ENUM / VLGM / generico 1 byte
      if (tipo === "ENUM" || tipo === "VLGM" || size === 1) {
        const v = parseInt(valStr);
        if (!isNaN(v)) {
          buf[addr] = v & 0xFF;
          count++;
        }
        return;
      }

      // INT16
      if (tipo === "INT" && size === 2) {
        const v = parseInt(valStr);
        if (!isNaN(v)) {
          buf[addr]     = (v >> 8) & 0xFF;
          buf[addr + 1] = v & 0xFF;
          count += 2;
        }
        return;
      }

      // INT32
      if (tipo === "INT" && size === 4) {
        const v = parseInt(valStr);
        if (!isNaN(v)) {
          buf[addr]     = (v >> 24) & 0xFF;
          buf[addr + 1] = (v >> 16) & 0xFF;
          buf[addr + 2] = (v >> 8) & 0xFF;
          buf[addr + 3] = v & 0xFF;
          count += 4;
        }
        return;
      }

      // BITMASK (1 byte)
      if (tipo === "BIT") {
        const v = parseInt(valStr);
        if (!isNaN(v)) {
          buf[addr] = v & 0xFF;
          count++;
        }
        return;
      }

      // STRING (se mai userai)
      if (tipo === "STRING") {
        for (let i = 0; i < size; i++) {
          buf[addr + i] = valStr.charCodeAt(i) || 0;
        }
        count += size;
        return;
      }
    });

    log("Parametri scritti da tabella: " + count + " byte.");
  }

  // Blocchi FF reali (dal tuo file)
  const blocchiFF = [
    { start: 0x0000, end: 0x01FF },
    { start: 0x0520, end: 0x05FF },
    { start: 0x0A000, end: 0x1FFF }
  ];

  btnGenera.addEventListener("click", function () {
    logDiv.textContent = "";

    log("Creazione buffer memoria 8192 byte a 0x00...");
    const buf = creaBufferMemoria();

    log("Applicazione blocchi FF...");
    applicaBlocchiFF(buf, blocchiFF);

    log("Scrittura parametri da x2_parametri_data.js...");
    scriviParametriDaTabella(buf);

    log("Conversione in formato Intel HEX...");
    const hex = bufferToIntelHex(buf, 0x0000);

    log("Download file: x1_memoria.hex");
    scaricaFile("x1_memoria.hex", hex);
    log("Operazione completata.\n");
  });
  </script>
</body>
</html>
