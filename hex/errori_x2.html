<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X2 – Errori (Mobile)</title>

<style>
/* ---------------------------------------------------------
   STILE MOBILE-FIRST – APP MODERNA
--------------------------------------------------------- */

body {
  margin: 0;
  padding: 10px;
  background: #0d0d0d;
  color: #e6e6e6;
  font-family: Arial, sans-serif;
}

/* Titolo */
h1 {
  font-size: 18px;
  margin-bottom: 10px;
  text-align: center;
}

/* Pulsanti memoria */
.mem-buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.mem-buttons button {
  flex: 1;
  padding: 10px 0;
  background: #1c1c1c;
  border: 1px solid #333;
  color: #eee;
  border-radius: 6px;
  font-size: 14px;
}

.mem-buttons button.active {
  background: #007aff;
  border-color: #007aff;
}

/* Pulsante AI */
.ai-button {
  text-align: right;
  margin-bottom: 10px;
}

.ai-button button {
  padding: 10px 14px;
  background: #222;
  border: 1px solid #444;
  color: #fff;
  border-radius: 6px;
  font-size: 14px;
}

/* ---------------------------------------------------------
   LISTA ERRORI (invece della tabella)
--------------------------------------------------------- */

.error-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.error-card {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px;
}

.error-card.selected {
  border-color: #007aff;
  background: #112233;
}

.error-title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 4px;
}

.error-sub {
  font-size: 12px;
  opacity: 0.8;
}

/* ---------------------------------------------------------
   DETTAGLI ERRORE
--------------------------------------------------------- */

.details {
  margin-top: 12px;
  padding: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  font-size: 13px;
}

/* ---------------------------------------------------------
   GEMME – versione compatta
--------------------------------------------------------- */

.gem-section {
  margin-top: 12px;
  padding: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
}

.gem-title {
  font-size: 13px;
  margin-bottom: 6px;
  font-weight: bold;
}

.gem-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
}

.gem {
  text-align: center;
  font-size: 9px;
}

.gem-dot {
  width: 10px;
  height: 10px;
  margin: 0 auto 2px auto;
  border-radius: 50%;
  background: #222;
  border: 1px solid #555;
}

.gem-dot.on.in { background: #00c853; box-shadow: 0 0 4px #00c853; }
.gem-dot.on.out { background: #00b0ff; box-shadow: 0 0 4px #00b0ff; }
.gem-dot.on.flag { background: #ffab00; box-shadow: 0 0 4px #ffab00; }

</style>
</head>

<body>

<h1>ERRORI X2</h1>

<!-- Pulsanti memorie -->
<div class="mem-buttons">
  <button id="btnMemA" class="active">A</button>
  <button id="btnMemB">B</button>
  <button id="btnMemC">C</button>
  <button id="btnLoadFile">File</button>
</div>

<!-- Pulsante AI -->
<div class="ai-button">
  <button id="btnAI">Analizza con AI</button>
</div>

<!-- LISTA ERRORI -->
<div id="errorList" class="error-list"></div>

<!-- DETTAGLI -->
<div id="detailsErrore" class="details">
  Nessun errore selezionato.
</div>

<!-- GEMME IN -->
<div class="gem-section">
  <div class="gem-title">Ingressi (IN01–IN64)</div>
  <div id="gridIN" class="gem-grid"></div>
</div>

<!-- GEMME OUT -->
<div class="gem-section">
  <div class="gem-title">Uscite (OUT01–OUT64)</div>
  <div id="gridOUT" class="gem-grid"></div>
</div>

<!-- GEMME FLAG -->
<div class="gem-section">
  <div class="gem-title">Flag (FLAG01–FLAG32)</div>
  <div id="gridFLAG" class="gem-grid"></div>
</div>

<script>
/* ---------------------------------------------------------
   LOGICA JS – identica alla tua, adattata al layout mobile
--------------------------------------------------------- */

const memA = new Uint8Array(0x1000);
const memB = new Uint8Array(0x1000);
const memC = new Uint8Array(0x1000);

(function initFake() {
  for (let i = 0; i < 16; i++) {
    const base = 0x800 + i * 16;
    memA[base + 0] = 20 + i;
    memA[base + 1] = i % 8;
    memA[base + 2] = 21;
    memA[base + 3] = 5;
    memA[base + 4] = 26;
    memA[base + 5] = 8;
    memA[base + 6] = i * 3;
  }
})();

let currentMem = 'A';
let currentSelected = -1;

function getMem() {
  return currentMem === 'A' ? memA : currentMem === 'B' ? memB : memC;
}

/* ---------------------------------------------------------
   COSTRUZIONE LISTA ERRORI (mobile)
--------------------------------------------------------- */

function buildErrorList() {
  const list = document.getElementById('errorList');
  list.innerHTML = '';

  const mem = getMem();

  for (let i = 0; i < 16; i++) {
    const base = 0x800 + i * 16;
    const cod = mem[base + 0];
    const piano = mem[base + 1];
    const g = mem[base + 2];
    const m = mem[base + 3];
    const a = mem[base + 4];
    const h = mem[base + 5];
    const min = mem[base + 6];

    const card = document.createElement('div');
    card.className = 'error-card';
    card.dataset.index = i;

    card.innerHTML = `
      <div class="error-title">Errore ${cod}</div>
      <div class="error-sub">
        Piano ${piano} – ${String(g).padStart(2,'0')}/${String(m).padStart(2,'0')}/20${a}
        – ${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}
      </div>
    `;

    card.onclick = () => selectError(i);
    list.appendChild(card);
  }
}

/* ---------------------------------------------------------
   SELEZIONE ERRORE
--------------------------------------------------------- */

function selectError(i) {
  currentSelected = i;

  document.querySelectorAll('.error-card')
    .forEach(c => c.classList.remove('selected'));

  const card = document.querySelector(`.error-card[data-index="${i}"]`);
  if (card) card.classList.add('selected');

  updateDetails(i);
  updateGems(i);
}

/* ---------------------------------------------------------
   DETTAGLI
--------------------------------------------------------- */

function updateDetails(i) {
  const mem = getMem();
  const base = 0x800 + i * 16;

  const cod = mem[base + 0];
  const piano = mem[base + 1];
  const g = mem[base + 2];
  const m = mem[base + 3];
  const a = mem[base + 4];
  const h = mem[base + 5];
  const min = mem[base + 6];
  const s = mem[base + 7];

  document.getElementById('detailsErrore').innerHTML = `
    <strong>Errore:</strong> ${cod}<br>
    <strong>Piano:</strong> ${piano}<br>
    <strong>Data:</strong> ${String(g).padStart(2,'0')}/${String(m).padStart(2,'0')}/20${a}<br>
    <strong>Ora:</strong> ${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}
  `;
}

/* ---------------------------------------------------------
   GEMME (placeholder)
--------------------------------------------------------- */

function updateGems(i) {
  document.querySelectorAll('.gem-dot').forEach(d => d.classList.remove('on'));
}

/* ---------------------------------------------------------
   COSTRUZIONE GEMME
--------------------------------------------------------- */

function buildGems() {
  const IN = document.getElementById('gridIN');
  const OUT = document.getElementById('gridOUT');
  const FLAG = document.getElementById('gridFLAG');

  for (let i = 1; i <= 64; i++) {
    IN.innerHTML += `<div class="gem"><div class="gem-dot in"></div>IN${String(i).padStart(2,'0')}</div>`;
    OUT.innerHTML += `<div class="gem"><div class="gem-dot out"></div>OUT${String(i).padStart(2,'0')}</div>`;
  }

  for (let i = 1; i <= 32; i++) {
    FLAG.innerHTML += `<div class="gem"><div class="gem-dot flag"></div>F${String(i).padStart(2,'0')}</div>`;
  }
}

/* ---------------------------------------------------------
   MEMORIE
--------------------------------------------------------- */

function setMem(m) {
  currentMem = m;
  currentSelected = -1;

  document.getElementById('btnMemA').classList.toggle('active', m === 'A');
  document.getElementById('btnMemB').classList.toggle('active', m === 'B');
  document.getElementById('btnMemC').classList.toggle('active', m === 'C');

  buildErrorList();
  document.getElementById('detailsErrore').textContent = 'Nessun errore selezionato.';
  updateGems(-1);
}

/* ---------------------------------------------------------
   AI MOCK
--------------------------------------------------------- */

function aiMock() {
  if (currentSelected < 0) {
    alert("Seleziona un errore.");
    return;
  }
  alert("AI (mock): analisi errore " + currentSelected);
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */

document.addEventListener('DOMContentLoaded', () => {
  buildGems();
  buildErrorList();

  document.getElementById('btnMemA').onclick = () => setMem('A');
  document.getElementById('btnMemB').onclick = () => setMem('B');
  document.getElementById('btnMemC').onclick = () => setMem('C');
  document.getElementById('btnAI').onclick = aiMock;
});
</script>

</body>
</html>
