<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Creazione Memoria – X2</title>

<style>
body {
    background:#111;
    color:#eee;
    font-family:Arial;
    padding:20px;
}

.file-block {
    margin-bottom:20px;
    padding:15px;
    border:1px solid #444;
    border-radius:6px;
    background:#1a1a1a;
}

button {
    padding:8px 14px;
    margin-top:8px;
    cursor:pointer;
}

#gitPopup {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}

#gitBox {
    background:#222;
    padding:20px;
    width:350px;
    max-height:70%;
    overflow-y:auto;
    border-radius:8px;
}

.git-item {
    padding:8px;
    margin:4px 0;
    background:#333;
    cursor:pointer;
    border-radius:4px;
}

.git-item:hover {
    background:#555;
}
</style>

</head>
<body>

<h2>CREA MEMORIA C</h2>

<!-- ============================
     FILE A
============================= -->
<div class="file-block">
    <h3 id="labelFileA">FILE A: nessun file</h3>
    <input type="file" id="fileA">
    <br>
    <button onclick="selezionaSlot('A')">Carica FILE A da Git</button>
</div>

<!-- ============================
     FILE B
============================= -->
<div class="file-block">
    <h3 id="labelFileB">FILE B: nessun file</h3>
    <input type="file" id="fileB">
    <br>
    <button onclick="selezionaSlot('B')">Carica FILE B da Git</button>
</div>

<!-- ============================
     CREAZIONE C
============================= -->
<div class="file-block" id="crea-memoria-container" style="display:none;">
    <h3>CREA MEMORIA C</h3>
    <input type="text" id="nomeC" placeholder="Nome memoria C">
    <br><br>
    <button onclick="creaMemoriaC()">CREA MEMORIA C</button>
</div>

<!-- ============================
     POPUP GIT
============================= -->
<div id="gitPopup">
    <div id="gitBox">
        <h3>Seleziona file da Git</h3>
        <div id="gitList"></div>
        <br>
        <button id="btnChiudiGit">Chiudi</button>
    </div>
</div>

<script src="crea_memoria.js"></script>
</body>
</html>
