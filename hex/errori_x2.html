<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>X2 - Pagina errori</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 8px;
      background: #111;
      color: #eee;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .mem-buttons button,
    .ai-button button {
      padding: 4px 8px;
      margin-right: 4px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }

    .mem-buttons button.active {
      background: #0a84ff;
      border-color: #0a84ff;
    }

    .mem-buttons button:hover,
    .ai-button button:hover {
      background: #333;
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Tabella errori */
    .table-container {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #444;
      border-radius: 4px;
      background: #181818;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    thead {
      position: sticky;
      top: 0;
      background: #222;
      z-index: 1;
    }

    th, td {
      padding: 4px 6px;
      border-bottom: 1px solid #333;
      text-align: left;
      white-space: nowrap;
    }

    tr.selected {
      background: #264f78;
    }

    tr:hover {
      background: #222;
      cursor: pointer;
    }

    /* Gemme */
    .gem-section {
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px;
      background: #181818;
    }

    .gem-section-title {
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .gem-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
    }

    .gem {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
    }

    .gem-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #555;
      background: #222;
    }

    .gem-dot.on.in {
      background: #00c853;
      box-shadow: 0 0 4px #00c853;
    }

    .gem-dot.on.out {
      background: #00b0ff;
      box-shadow: 0 0 4px #00b0ff;
    }

    .gem-dot.on.flag {
      background: #ffab00;
      box-shadow: 0 0 4px #ffab00;
    }

    .gem-label {
      color: #ccc;
    }

    /* Dettagli errore selezionato */
    .details {
      font-size: 11px;
      margin-top: 4px;
      color: #ccc;
    }

    .details span {
      margin-right: 12px;
    }

    @media (max-width: 600px) {
      th, td {
        font-size: 10px;
      }
      .gem-label {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>

<h1>ERRORI X2 – Memorie A/B/C + Gemme IN/OUT/FLAG</h1>

<div class="top-bar">
  <div class="mem-buttons">
    <button id="btnMemA" class="active">Memoria A</button>
    <button id="btnMemB">Memoria B</button>
    <button id="btnMemC">Memoria C</button>
    <button id="btnLoadFile">Carica file…</button>
  </div>
  <div class="ai-button">
    <button id="btnAI">Analizza con AI (mock)</button>
  </div>
</div>

<div class="layout">

  <!-- TABELLONE ERRORI -->
  <div class="table-container">
    <table id="tblErrori">
      <thead>
        <tr>
          <th>#</th>
          <th>Data</th>
          <th>Ora</th>
          <th>Piano</th>
          <th>Codice</th>
          <th>Descrizione</th>
        </tr>
      </thead>
      <tbody>
        <!-- righe generate via JS -->
      </tbody>
    </table>
  </div>

  <!-- DETTAGLI ERRORE SELEZIONATO -->
  <div class="details" id="detailsErrore">
    Nessun errore selezionato.
  </div>

  <!-- GEMME IN -->
  <div class="gem-section">
    <div class="gem-section-title">Ingressi (IN01 – IN64)</div>
    <div class="gem-grid" id="gridIN">
      <!-- gemme IN generate via JS -->
    </div>
  </div>

  <!-- GEMME OUT -->
  <div class="gem-section">
    <div class="gem-section-title">Uscite (OUT01 – OUT64)</div>
    <div class="gem-grid" id="gridOUT">
      <!-- gemme OUT generate via JS -->
    </div>
  </div>

  <!-- GEMME FLAG -->
  <div class="gem-section">
    <div class="gem-section-title">Flag (FLAG01 – FLAG32)</div>
    <div class="gem-grid" id="gridFLAG">
      <!-- gemme FLAG generate via JS -->
    </div>
  </div>

</div>

<script>
/* =========================================================================
   Pagina errori X2 - logica base
   v2026-05-21 09:30
   - Tabella errori (16 errori x 16 byte, da 0x800 a 0x8FF)
   - Gemme IN/OUT/FLAG (placeholder, tutte spente)
   - Tasto AI (mock)
   ======================================================================= */

/* -----------------------------------------------------------------------
   1. Placeholder memorie A/B/C
   -------------------------------------------------------------------- */
/*
   QUI dovrai sostituire memA, memB, memC con i dati reali letti dalla
   EEPROM (zona 0x800–0x8FF). Per ora metto array finti per vedere la
   struttura funzionare.
*/

const memA = new Uint8Array(0x1000); // placeholder
const memB = new Uint8Array(0x1000); // placeholder
const memC = new Uint8Array(0x1000); // placeholder

// Per test: riempiamo qualche errore finto in memA
(function initFakeErrors() {
  for (let i = 0; i < 16; i++) {
    const base = 0x800 + i * 16;
    memA[base + 0] = 10 + i;      // codice errore
    memA[base + 1] = i % 8;       // piano
    memA[base + 2] = 21;          // giorno
    memA[base + 3] = 5;           // mese
    memA[base + 4] = 26;          // anno (2026 -> 26)
    memA[base + 5] = 8;           // ora
    memA[base + 6] = i * 3;       // minuto
    memA[base + 7] = 0;           // secondi (placeholder)
    // byte 8–15: per ora li lasciamo a 0 (gemme tutte spente)
  }
})();

/* -----------------------------------------------------------------------
   2. Stato corrente
   -------------------------------------------------------------------- */

let currentMem = 'A';   // 'A', 'B', 'C'
let currentSelectedIndex = -1; // indice errore selezionato (0–15)

/* -----------------------------------------------------------------------
   3. Utility: accesso memoria corrente
   -------------------------------------------------------------------- */

function getCurrentMemArray() {
  if (currentMem === 'A') return memA;
  if (currentMem === 'B') return memB;
  return memC;
}

/* -----------------------------------------------------------------------
   4. Costruzione gemme (IN/OUT/FLAG)
   -------------------------------------------------------------------- */

function createGems() {
  const gridIN = document.getElementById('gridIN');
  const gridOUT = document.getElementById('gridOUT');
  const gridFLAG = document.getElementById('gridFLAG');

  // IN01–IN64
  for (let i = 1; i <= 64; i++) {
    const gem = document.createElement('div');
    gem.className = 'gem';
    const dot = document.createElement('div');
    dot.className = 'gem-dot in';
    dot.dataset.type = 'in';
    dot.dataset.index = i;
    const label = document.createElement('span');
    label.className = 'gem-label';
    label.textContent = 'IN' + String(i).padStart(2, '0');
    gem.appendChild(dot);
    gem.appendChild(label);
    gridIN.appendChild(gem);
  }

  // OUT01–OUT64
  for (let i = 1; i <= 64; i++) {
    const gem = document.createElement('div');
    gem.className = 'gem';
    const dot = document.createElement('div');
    dot.className = 'gem-dot out';
    dot.dataset.type = 'out';
    dot.dataset.index = i;
    const label = document.createElement('span');
    label.className = 'gem-label';
    label.textContent = 'OUT' + String(i).padStart(2, '0');
    gem.appendChild(dot);
    gem.appendChild(label);
    gridOUT.appendChild(gem);
  }

  // FLAG01–FLAG32
  for (let i = 1; i <= 32; i++) {
    const gem = document.createElement('div');
    gem.className = 'gem';
    const dot = document.createElement('div');
    dot.className = 'gem-dot flag';
    dot.dataset.type = 'flag';
    dot.dataset.index = i;
    const label = document.createElement('span');
    label.className = 'gem-label';
    label.textContent = 'FLAG' + String(i).padStart(2, '0');
    gem.appendChild(dot);
    gem.appendChild(label);
    gridFLAG.appendChild(gem);
  }
}

/* -----------------------------------------------------------------------
   5. Aggiornamento gemme da bit (placeholder)
   -------------------------------------------------------------------- */
/*
   Quando avrai la mappa dei bit, qui dentro useremo i byte 8–15
   del blocco errore per accendere/spegnere le gemme.

   Per ora: tutte spente.
*/

function updateGemsForError(errorIndex) {
  const dots = document.querySelectorAll('.gem-dot');
  dots.forEach(dot => dot.classList.remove('on'));

  if (errorIndex < 0) return;

  const mem = getCurrentMemArray();
  const base = 0x800 + errorIndex * 16;

  // byte 8–15: dettagli IN/OUT/FLAG (placeholder)
  const detailBytes = [];
  for (let i = 0; i < 8; i++) {
    detailBytes.push(mem[base + 8 + i]);
  }

  // QUI in futuro:
  // - decodifica detailBytes in bit
  // - accendi le gemme corrispondenti
  // Esempio futuro (pseudo):
  // if (bit IN01 = 1) -> gem-dot[data-type="in"][data-index="1"].classList.add('on');

  // Per ora lasciamo tutto spento.
}

/* -----------------------------------------------------------------------
   6. Costruzione tabella errori
   -------------------------------------------------------------------- */

function buildErrorTable() {
  const tbody = document.querySelector('#tblErrori tbody');
  tbody.innerHTML = '';

  const mem = getCurrentMemArray();

  // Ora: 16 errori (0–15). In futuro potrai portarlo a 64.
  const maxErrori = 16;

  for (let i = 0; i < maxErrori; i++) {
    const base = 0x800 + i * 16;
    const codice = mem[base + 0];
    const piano  = mem[base + 1];
    const giorno = mem[base + 2];
    const mese   = mem[base + 3];
    const anno   = mem[base + 4];
    const ora    = mem[base + 5];
    const minuto = mem[base + 6];
    const secondo= mem[base + 7];

    // Se codice = 0 e tutto il resto è 0, possiamo considerarlo "vuoto"
    const isEmpty = (codice === 0 && piano === 0 && giorno === 0 &&
                     mese === 0 && anno === 0 && ora === 0 &&
                     minuto === 0 && secondo === 0);

    if (isEmpty) {
      // Puoi decidere se saltare la riga o mostrarla vuota.
      // Per ora la mostro lo stesso, ma con descrizione "—".
    }

    const tr = document.createElement('tr');
    tr.dataset.index = i;

    const tdIdx = document.createElement('td');
    tdIdx.textContent = i + 1;

    const tdData = document.createElement('td');
    tdData.textContent =
      String(giorno).toString().padStart(2, '0') + '/' +
      String(mese).toString().padStart(2, '0') + '/20' +
      String(anno).toString().padStart(2, '0');

    const tdOra = document.createElement('td');
    tdOra.textContent =
      String(ora).toString().padStart(2, '0') + ':' +
      String(minuto).toString().padStart(2, '0');

    const tdPiano = document.createElement('td');
    tdPiano.textContent = piano;

    const tdCod = document.createElement('td');
    tdCod.textContent = codice;

    const tdDesc = document.createElement('td');
    // Descrizione: per ora placeholder. In futuro useremo una tabella codici.
    tdDesc.textContent = isEmpty ? '—' : ('Errore ' + codice);

    tr.appendChild(tdIdx);
    tr.appendChild(tdData);
    tr.appendChild(tdOra);
    tr.appendChild(tdPiano);
    tr.appendChild(tdCod);
    tr.appendChild(tdDesc);

    tr.addEventListener('click', () => onSelectErrorRow(i));

    tbody.appendChild(tr);
  }
}

/* -----------------------------------------------------------------------
   7. Selezione riga errore
   -------------------------------------------------------------------- */

function onSelectErrorRow(index) {
  currentSelectedIndex = index;

  // evidenzia riga
  const rows = document.querySelectorAll('#tblErrori tbody tr');
  rows.forEach(r => r.classList.remove('selected'));
  const row = document.querySelector('#tblErrori tbody tr[data-index="' + index + '"]');
  if (row) row.classList.add('selected');

  // aggiorna dettagli
  updateDetailsForError(index);

  // aggiorna gemme
  updateGemsForError(index);
}

/* -----------------------------------------------------------------------
   8. Dettagli errore selezionato
   -------------------------------------------------------------------- */

function updateDetailsForError(index) {
  const details = document.getElementById('detailsErrore');
  if (index < 0) {
    details.textContent = 'Nessun errore selezionato.';
    return;
  }

  const mem = getCurrentMemArray();
  const base = 0x800 + index * 16;

  const codice = mem[base + 0];
  const piano  = mem[base + 1];
  const giorno = mem[base + 2];
  const mese   = mem[base + 3];
  const anno   = mem[base + 4];
  const ora    = mem[base + 5];
  const minuto = mem[base + 6];
  const secondo= mem[base + 7];

  const dataStr =
    String(giorno).padStart(2, '0') + '/' +
    String(mese).padStart(2, '0') + '/20' +
    String(anno).padStart(2, '0');

  const oraStr =
    String(ora).padStart(2, '0') + ':' +
    String(minuto).padStart(2, '0') + ':' +
    String(secondo).padStart(2, '0');

  details.innerHTML =
    '<span><strong>Errore:</strong> ' + codice + '</span>' +
    '<span><strong>Piano:</strong> ' + piano + '</span>' +
    '<span><strong>Data:</strong> ' + dataStr + '</span>' +
    '<span><strong>Ora:</strong> ' + oraStr + '</span>';
}

/* -----------------------------------------------------------------------
   9. Gestione tasti memorie A/B/C
   -------------------------------------------------------------------- */

function setMemoria(mem) {
  currentMem = mem;
  currentSelectedIndex = -1;

  document.getElementById('btnMemA').classList.toggle('active', mem === 'A');
  document.getElementById('btnMemB').classList.toggle('active', mem === 'B');
  document.getElementById('btnMemC').classList.toggle('active', mem === 'C');

  buildErrorTable();
  updateDetailsForError(-1);
  updateGemsForError(-1);
}

/* -----------------------------------------------------------------------
   10. Tasto AI (mock)
   -------------------------------------------------------------------- */

function onAIAnalyze() {
  if (currentSelectedIndex < 0) {
    alert('Seleziona prima un errore nella tabella.');
    return;
  }

  const mem = getCurrentMemArray();
  const base = 0x800 + currentSelectedIndex * 16;

  const codice = mem[base + 0];
  const piano  = mem[base + 1];

  // Qui in futuro manderemo i dati reali all’AI.
  // Ora facciamo solo una simulazione testuale.
  const msg =
    'AI (simulazione)\n\n' +
    'Errore ' + codice + ' al piano ' + piano + '.\n\n' +
    'Possibili cause (esempio):\n' +
    '- Controllare sensori di piano\n' +
    '- Verificare porte e sicurezze\n' +
    '- Controllare cablaggi e alimentazioni\n\n' +
    '(In futuro questo testo arriverà dall’AI, usando i dati reali.)';

  alert(msg);
}

/* -----------------------------------------------------------------------
   11. Tasto "Carica file…" (placeholder)
   -------------------------------------------------------------------- */

function onLoadFile() {
  alert('Placeholder: qui in futuro potrai caricare una memoria da file.\n' +
        'Per ora la pagina usa memA/memB/memC fittizie.');
}

/* -----------------------------------------------------------------------
   12. Inizializzazione pagina
   -------------------------------------------------------------------- */

function initPage() {
  createGems();
  buildErrorTable();

  document.getElementById('btnMemA').addEventListener('click', () => setMemoria('A'));
  document.getElementById('btnMemB').addEventListener('click', () => setMemoria('B'));
  document.getElementById('btnMemC').addEventListener('click', () => setMemoria('C'));
  document.getElementById('btnAI').addEventListener('click', onAIAnalyze);
  document.getElementById('btnLoadFile').addEventListener('click', onLoadFile);
}

document.addEventListener('DOMContentLoaded', initPage);
</script>

</body>
</html>
