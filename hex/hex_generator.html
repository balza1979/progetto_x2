<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore Memoria HEX – X1/X2</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#0d0d0d;
      color:#f5f5f5;
      margin:0;
      padding:20px;
    }
    .page {
      max-width:600px;
      margin:0 auto;
      background:#1a11a1;
      border:3px solid #cc0000;
      padding:16px;
      box-sizing:border-box;
      border-radius:10px;
      box-shadow:0 0 25px rgba(255,0,0,0.45);
    }
    h1 {
      font-size:20px;
      color:#ff3333;
      text-align:center;
      margin-top:0;
      text-shadow:0 0 6px rgba(255,0,0,0.5);
    }
    .section-title {
      margin:18px 0 6px;
      font-size:14px;
      font-weight:bold;
      color:#ff3333;
      border-bottom:2px solid #660000;
      padding-bottom:3px;
    }
    textarea {
      width:100%;
      height:120px;
      box-sizing:border-box;
      border-radius:6px;
      border:2px solid #660000;
      background:#0d0d0d;
      color:#ffcccc;
      padding:6px;
      font-size:12px;
    }
    button {
      margin-top:10px;
      padding:8px 14px;
      border-radius:6px;
      border:2px solid #ff1a1a;
      background:#660000;
      color:#ffffff;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 0 10px rgba(255,0,0,0.4);
    }
    .log {
      margin-top:10px;
      font-size:12px;
      color:#cccccc;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Generatore Memoria HEX – X1/X2</h1>

    <div class="section-title">Sorgente dati (CSV)</div>
    <textarea id="csv_input" placeholder="(non usato per ora)"></textarea>

    <button id="genera_hex_btn">Genera file HEX</button>

    <div class="section-title">Log operazioni</div>
    <div id="log" class="log"></div>
  </div>

  <!-- ⚠️ CARICA PRIMA LA TABELLA PARAMETRI -->
  <script src="../js/x2_parametri_data.js"></script>

  <script>
  const logDiv = document.getElementById("log");
  const btnGenera = document.getElementById("genera_hex_btn");

  function log(msg) {
    logDiv.textContent += msg + "\n";
  }

  // ------------------------------------------------------------
  // CREA BUFFER 8192 BYTE
  // ------------------------------------------------------------
  function creaBufferMemoria() {
    const buf = new Uint8Array(8192);
    buf.fill(0x00);
    return buf;
  }

  // ------------------------------------------------------------
  // APPLICA BLOCCHI FF
  // ------------------------------------------------------------
  function applicaBlocchiFF(buf, ranges) {
    ranges.forEach(r => {
      const s = Math.max(0, r.start);
      const e = Math.min(buf.length - 1, r.end);
      for (let i = s; i <= e; i++) buf[i] = 0xFF;
    });
  }

  // ------------------------------------------------------------
  // CHECKSUM INTEL HEX
  // ------------------------------------------------------------
  function intelHexChecksum(byteArray) {
    let sum = 0;
    for (let i = 0; i < byteArray.length; i++) {
      sum = (sum + byteArray[i]) & 0xFF;
    }
    return ((~sum + 1) & 0xFF);
  }

  // ------------------------------------------------------------
  // CONVERSIONE BUFFER → INTEL HEX
  // ------------------------------------------------------------
  function bufferToIntelHex(buf, baseAddress = 0x0000) {
    const lines = [];

    lines.push("BBB:020000040000FA");

    const recordSize = 16;

    for (let addr = 0; addr < buf.length; addr += recordSize) {
      const chunk = buf.slice(addr, addr + recordSize);
      const byteCount = chunk.length;
      const address = baseAddress + addr;
      const recordType = 0x00;

      const bytes = [
        byteCount,
        (address >> 8) & 0xFF,
        address & 0xFF,
        recordType
      ];

      for (let i = 0; i < chunk.length; i++) bytes.push(chunk[i]);

      const chk = intelHexChecksum(bytes);

      let line = ":" +
        bytes.map(b => b.toString(16).toUpperCase().padStart(2, "0")).join("") +
        chk.toString(16).toUpperCase().padStart(2, "0");

      lines.push(line);
    }

    lines.push(":00000001FF");
    return lines.join("\n");
  }

  // ------------------------------------------------------------
  // SCARICA FILE
  // ------------------------------------------------------------
  function scaricaFile(nome, contenuto) {
    const blob = new Blob([contenuto], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ------------------------------------------------------------
  // ⭐ SCRITTURA PARAMETRI (VERSIONE CORRETTA)
  // ------------------------------------------------------------
  function scriviParametriDaTabella(buf) {

    if (typeof x2_parametri === "undefined") {
      log("ERRORE: x2_parametri_data.js NON caricato!");
      return;
    }

    let count = 0;

    x2_parametri.forEach(p => {

      let addr = parseInt(p.LIBERA1, 16);
      if (isNaN(addr)) return;

      let size = parseInt(p.LIBERA2);
      if (isNaN(size) || size <= 0) return;

      let valStr = (p.VALORE || "").trim();
      if (valStr === "" || valStr === "/") return;

      let tipo = (p.LIBERA3 || "").toUpperCase();

      // ENUM / VLGM
      if (tipo.startsWith("ENUM") || tipo === "VLGM") {
        let v = Number(valStr);
        if (!isNaN(v)) {
          buf[addr] = v & 0xFF;
          count++;
        }
        return;
      }

      // BITMASK
      if (tipo === "BIT") {
        let v = Number(valStr);
        if (!isNaN(v)) {
          buf[addr] = v & 0xFF;
          count++;
        }
        return;
      }

     // NUMERICO con offset e scala
// NUMERICO
if (tipo === "NUM") {

    let valore = parseFloat(valStr);
    if (isNaN(valore)) return;

    let scala = parseInt(p.LIBERA4);
    if (isNaN(scala) || scala <= 0) scala = 1;

    // NUM SENZA OFFSET (scala = 1)
    if (scala === 1) {
        buf[addr] = valore & 0xFF;
        count++;
        return;
    }

    // NUM CON OFFSET (scala > 1)
    let match = p.LIBERA6.match(/(\d+(\.\d+)?)/);
    let offset = match ? parseFloat(match[1]) : 0;

    let byteVal = Math.round((valore - offset) * scala);

    buf[addr] = byteVal & 0xFF;
    count++;
    return;
}



      // INT16
      if (tipo === "INT" && size === 2) {
        let v = Number(valStr);
        if (!isNaN(v)) {
          buf[addr]     = (v >> 8) & 0xFF;
          buf[addr + 1] = v & 0xFF;
          count += 2;
        }
        return;
      }

      // INT32
      if (tipo === "INT" && size === 4) {
        let v = Number(valStr);
        if (!isNaN(v)) {
          buf[addr]     = (v >> 24) & 0xFF;
          buf[addr + 1] = (v >> 16) & 0xFF;
          buf[addr + 2] = (v >> 8) & 0xFF;
          buf[addr + 3] = v & 0xFF;
          count += 4;
        }
        return;
      }

      // Fallback
      let v = Number(valStr);
      if (!isNaN(v)) {
        buf[addr] = v & 0xFF;
        count++;
      }
    });

    log("Parametri scritti: " + count + " byte.");
  }

  // ------------------------------------------------------------
  // BLOCCHI FF
  // ------------------------------------------------------------
  const blocchiFF = [
    { start: 0x0000, end: 0x01FF },
    { start: 0x0520, end: 0x05FF },
    { start: 0x0A000, end: 0x1FFF }
  ];

  // ------------------------------------------------------------
  // GENERA HEX
  // ------------------------------------------------------------
  btnGenera.addEventListener("click", function () {
    logDiv.textContent = "";

    log("Creo buffer 8192 byte...");
    const buf = creaBufferMemoria();

    log("Applico blocchi FF...");
    applicaBlocchiFF(buf, blocchiFF);

    log("Scrivo parametri da tabella...");
    scriviParametriDaTabella(buf);
    // Valore fisso firmware X2
buf[0x0351] = 0x03;

    
    log("Genero file Intel HEX...");
    const hex = bufferToIntelHex(buf);

    scaricaFile("x2_memoria.hex", hex);
    log("Fatto.");
  });

  </script>
</body>
</html>
